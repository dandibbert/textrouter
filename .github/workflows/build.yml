name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.2.0) from the commit being built; empty = only build"
        required: false
        default: ""
      release_notes:
        description: "Text put above the generated release notes"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 -v ./engine/ 2>&1 | grep -E "^(---|ok|FAIL)|pass|truth|cleaners:|examples"
      - run: go test -count=1 ./...
      - name: Cross-build macOS binaries from Linux
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /tmp/textrouter-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o /tmp/textrouter-amd64 .

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./engine/
      - name: Build app and disk images (ad-hoc signed)
        run: go tool mygo build -platform darwin/arm64,darwin/amd64
      - name: Zip the .app bundles
        run: |
          cd build
          for d in darwin-*; do
            (cd "$d" && ditto -c -k --keepParent TextRouter.app "../TextRouter-$d.app.zip")
          done
          ls -la . darwin-*
      - uses: actions/upload-artifact@v4
        with:
          name: TextRouter-macOS
          path: |
            build/*.zip
            build/**/*.dmg
          if-no-files-found: error

  # Releases are built and signed (personal certificate) on the M1 of dandibbert/mac-build-hub,
  # which publishes them to this repository's releases; the ad-hoc build above only checks.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Hand the release to the M1 build hub
        env:
          GH_TOKEN: ${{ secrets.M1_BUILD_HUB_TOKEN }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::Add the M1_BUILD_HUB_TOKEN secret (the same value Paseo uses) to this repository"; exit 1; }
          gh workflow run textrouter-macos.yml -R dandibbert/mac-build-hub \
            -f source_sha="$GITHUB_SHA" -f tag="$TAG" -f release_notes="$NOTES"
          echo "Started the M1 build of $GITHUB_SHA for $TAG: https://github.com/dandibbert/mac-build-hub/actions/workflows/textrouter-macos.yml" >> "$GITHUB_STEP_SUMMARY"
