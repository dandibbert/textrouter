name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Type-check and build the frontend
        run: npm --prefix frontend run build
      - run: go vet ./...
      - run: go test -count=1 -v ./engine/ 2>&1 | grep -E "^(---|ok|FAIL)|pass|truth|cleaners:|examples"
      - run: go test -count=1 ./...
      - name: Cross-build macOS binaries from Linux
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /tmp/textrouter-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o /tmp/textrouter-amd64 .

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: go test -count=1 ./...
      - name: Build app and disk images (ad-hoc signed)
        run: go tool mygo build -platform darwin/arm64,darwin/amd64
      - name: Zip the .app bundles
        run: |
          cd build
          for d in darwin-*; do
            (cd "$d" && ditto -c -k --keepParent TextRouter.app "../TextRouter-$d.app.zip")
          done
          ls -la . darwin-*
      - uses: actions/upload-artifact@v4
        with:
          name: TextRouter-macOS
          path: |
            build/*.zip
            build/**/*.dmg
          if-no-files-found: error
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" build/*.zip build/*/*.dmg --clobber
