name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.2.0) from the commit being built; empty = only build"
        required: false
        default: ""
      release_notes:
        description: "Text put above the generated release notes"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 -v ./engine/ 2>&1 | grep -E "^(---|ok|FAIL)|pass|truth|cleaners:|examples"
      - run: go test -count=1 ./...
      - name: Cross-build macOS binaries from Linux
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /tmp/textrouter-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o /tmp/textrouter-amd64 .

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./engine/
      - name: Build app and disk images (ad-hoc signed)
        run: go tool mygo build -platform darwin/arm64,darwin/amd64
      - name: Zip the .app bundles
        run: |
          cd build
          for d in darwin-*; do
            (cd "$d" && ditto -c -k --keepParent TextRouter.app "../TextRouter-$d.app.zip")
          done
          ls -la . darwin-*
      - uses: actions/upload-artifact@v4
        with:
          name: TextRouter-macOS
          path: |
            build/*.zip
            build/**/*.dmg
          if-no-files-found: error
      - name: Attach to release (version tags, or a manual run with release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # A new tag is created at the commit being built.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TextRouter ${TAG#v}" --generate-notes --notes "$NOTES"
          fi
          gh release upload "$TAG" build/*.zip build/*/*.dmg --clobber
